<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Rabbit 🐰</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">
    <style>
        :root {
            --pink-main: #ff69b4;
            --pink-light: #ffb6c1;
            --pink-dark: #ff1493;
            --bg-color: #fff0f5;
            --sidebar-bg: #ffffff;
            --chat-bg: #fff5f8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* ---------- صفحه ورود ---------- */
        .login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; position: relative; z-index: 10;
        }
        .login-screen h2 { color: var(--pink-main); text-align: center; margin-bottom: 20px; font-size: 20px; }
        .login-screen input {
            padding: 12px; width: 260px; border: 2px solid var(--pink-light);
            border-radius: 8px; outline: none; font-size: 16px; text-align: center;
            font-family: inherit;
        }
        .login-screen button {
            padding: 12px 24px; background: var(--pink-main); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
            margin-top: 15px; transition: 0.3s; font-family: inherit; font-size: 15px;
        }
        .login-screen button:hover { background: var(--pink-dark); }
        .rabbit-deco { position: absolute; font-size: 60px; user-select: none; animation: blink 2s infinite; z-index: 0; }
        .rabbit-deco.left { left: 20px; bottom: 150px; }
        .rabbit-deco.right { right: 20px; bottom: 150px; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }

        /* ---------- چیدمان اصلی (سه ستون) ---------- */
        .app-container {
            display: none; width: 100%; max-width: 1100px; height: 92vh;
            background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(255,105,180,0.2);
            overflow: hidden; border: 2px solid var(--pink-light);
        }
        .main-layout { display: flex; width: 100%; height: 100%; }

        /* ستون سمت چپ: پروفایل */
        .sidebar-left {
            width: 260px; background: var(--sidebar-bg);
            border-left: 1px solid #ffc0cb;
            display: flex; flex-direction: column;
            align-items: center; padding: 20px 15px; text-align: center;
        }
        .profile-avatar-large {
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--pink-light); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; margin: 0 auto 12px;
            border: 2px solid var(--pink-main);
        }
        .profile-name { font-weight: bold; color: var(--pink-dark); font-size: 16px; margin-bottom: 4px; }
        .profile-username { color: #888; font-size: 12px; margin-bottom: 12px; }
        .profile-bio { font-size: 12px; color: #555; margin-bottom: 20px; line-height: 1.5; background: #fff5f8; padding: 8px; border-radius: 8px; width: 100%; word-break: break-word; }
        .edit-profile-btn {
            padding: 8px 15px; border: 1px solid var(--pink-main);
            color: var(--pink-main); background: none; border-radius: 20px;
            font-size: 12px; cursor: pointer; font-family: inherit; font-weight: bold;
            width: 100%; transition: 0.2s;
        }
        .edit-profile-btn:hover { background: var(--pink-main); color: white; }

        /* ستون وسط: چت عمومی (دست‌نخورده) */
        .chat-center {
            flex: 1; display: flex; flex-direction: column;
            background: var(--chat-bg); border-left: 1px solid #ffc0cb;
        }
        .chat-header {
            background: var(--pink-main); color: white; padding: 12px 15px;
            display: flex; align-items: center; justify-content: space-between;
            font-weight: bold; font-size: 15px;
        }
        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message { padding: 9px 13px; border-radius: 12px; max-width: 80%; font-size: 14px; word-break: break-word; }
        .message .sender { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; }
        .message.system { background: #ffe4e1; color: #d87093; align-self: center; font-size: 12px; border-radius: 20px; }
        .message.user { background: var(--pink-main); color: white; align-self: flex-end; }
        .message.other { background: white; color: #333; align-self: flex-start; border: 1px solid #ffc0cb; }

        .chat-input { display: flex; padding: 10px; background: white; border-top: 1px solid #ffc0cb; }
        .chat-input input {
            flex: 1; padding: 10px; border: 1px solid var(--pink-light);
            border-radius: 8px; outline: none; font-size: 14px; font-family: inherit;
        }
        .chat-input button {
            background: var(--pink-main); color: white; border: none;
            padding: 10px 18px; margin-right: 8px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-family: inherit;
        }

        /* ستون سمت راست: پی‌وی‌ها */
        .sidebar-right {
            width: 270px; background: white;
            display: flex; flex-direction: column;
        }
        .sidebar-right-header {
            padding: 14px; font-weight: bold; color: var(--pink-dark);
            border-bottom: 1px solid #ffe4e1; font-size: 14px; text-align: center;
            background: #fff9fb;
        }
        .users-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 8px; }
        .user-row {
            display: flex; align-items: center; gap: 10px; padding: 8px;
            border-radius: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .user-row:hover { background: #fff5f8; border-color: #ffc0cb; }
        .user-row .avatar-circle {
            width: 35px; height: 35px; border-radius: 50%; background: #ffe4e1;
            color: var(--pink-dark); display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: bold; flex-shrink: 0;
        }
        .user-row .info { flex: 1; text-align: right; overflow: hidden; }
        .user-row .info b { font-size: 13px; display: block; color: #333; }
        .user-row .info span { font-size: 11px; color: #888; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* مودال‌ها */
        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.45);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 22px; border-radius: 16px; width: 90%;
            max-width: 320px; display: flex; flex-direction: column; gap: 10px;
            border: 2px solid var(--pink-light);
        }
        .modal-content h3 { margin: 0 0 5px; text-align: center; color: var(--pink-main); }
        .modal-content input, .modal-content textarea {
            padding: 10px; border: 1px solid var(--pink-light); border-radius: 8px; outline: none; font-family: inherit; font-size: 14px; resize: none;
        }
        .modal-content button {
            padding: 10px; background: var(--pink-main); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit;
        }
        .code-box {
            background: #fff5f8; border: 2px dashed var(--pink-main); border-radius: 10px;
            padding: 14px; text-align: center; font-size: 26px; font-weight: bold;
            letter-spacing: 4px; color: var(--pink-dark); direction: ltr;
        }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="loginScreen" class="login-screen">
        <div class="rabbit-deco left">🐰</div>
        <div class="rabbit-deco right">🐰</div>
        <h2>به پیام‌رسان 🐰 Pink Rabbit 🐰 خوش اومدی</h2>
        <input type="text" id="phoneInput" placeholder="شماره موبایل (0912...)" maxlength="11" autocomplete="off">
        <button onclick="requestLogin()">ورود / ثبت‌نام</button>
    </div>

    <!-- مودال کد تایید -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <h3 id="codeTitle">کد ورود</h3>
            <p id="codeDesc" style="font-size:12px; color:#666; text-align:center; margin:0;"></p>
            <div class="code-box" id="codeBox" style="display: none;">------</div>
            <input type="text" id="codeInput" placeholder="کد را وارد کنید" style="text-align:center; direction:ltr; letter-spacing:3px;">
            <button onclick="submitCode()">تأیید و ورود</button>
        </div>
    </div>

    <!-- مودال تکمیل / ویرایش پروفایل -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3 id="profileModalTitle">تنظیمات پروفایل 🐰</h3>
            <input type="text" id="displayNameInput" placeholder="نام نمایشی">
            <input type="text" id="usernameInput" placeholder="نام کاربری (مثلاً mehdi)">
            <textarea id="bioInput" rows="3" placeholder="بیوگرافی..."></textarea>
            <button onclick="saveProfile()">ذخیره تغییرات</button>
            <button onclick="closeModal('profileModal')" style="background:#ccc; margin-top:-4px;" id="closeProfileBtn">انصراف</button>
        </div>
    </div>

    <!-- ساختار اصلی اپلیکیشن (سه ستون) -->
    <div id="appContainer" class="app-container">
        <div class="main-layout">
            
            <!-- ستون چپ: پروفایل کاربر -->
            <div class="sidebar-left">
                <div class="profile-avatar-large" id="myAvatarLarge">🐰</div>
                <div class="profile-name" id="myDisplayNameDisplay">نام کاربر</div>
                <div class="profile-username" id="myUsernameDisplay">@username</div>
                <div class="profile-bio" id="myBioDisplay">بیوگرافی کاربر...</div>
                <button class="edit-profile-btn" onclick="openEditProfile()">ویرایش پروفایل</button>
            </div>

            <!-- ستون وسط: چت (عمومی یا پی‌وی) -->
            <div class="chat-center">
                <div class="chat-header">
                    <span id="chatTitle">چت عمومی 🌐</span>
                </div>
                <div class="chat-messages" id="messagesList"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">ارسال</button>
                </div>
            </div>

            <!-- ستون راست: لیست پی‌وی‌ها و چت عمومی -->
            <div class="sidebar-right">
                <div class="sidebar-right-header">گفتگوها و مخاطبین</div>
                <div class="users-list" id="usersList"></div>
            </div>

        </div>
    </div>

    <script>
        let ws = null;
        let myPhone = "";
        let myProfile = { display_name: "", username: "", bio: "" };
        let currentChat = "public"; 
        let currentChatName = "چت عمومی 🌐";

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function requestLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!/^09\d{9}$/.test(phone)) { alert('شماره موبایل نامعتبر است!'); return; }
            myPhone = phone;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.error) { alert(data.error); return; }

                const codeBox = document.getElementById('codeBox');
                if (data.is_new) {
                    codeBox.innerText = data.code;
                    codeBox.style.display = 'block';
                    document.getElementById('codeTitle').innerText = 'کد دائمی شما';
                    document.getElementById('codeDesc').innerText = 'این کد را یادداشت کنید:';
                } else {
                    codeBox.style.display = 'none';
                    document.getElementById('codeTitle').innerText = 'ورود به حساب';
                    document.getElementById('codeDesc').innerText = 'کد ورود خود را وارد کنید:';
                }
                openModal('codeModal');
            } catch (e) { alert('خطا: ' + e.message); }
        }

        async function submitCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) { alert('کد را وارد کنید!'); return; }

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: myPhone, code })
                });
                const data = await res.json();
                if (!data.ok) { alert(data.error || 'کد اشتباه است!'); return; }

                closeModal('codeModal');
                myProfile = data.user || {};

                if (!myProfile.display_name || !myProfile.username) {
                    document.getElementById('closeProfileBtn').style.display = 'none';
                    openModal('profileModal');
                } else {
                    enterApp();
                }
            } catch (e) { alert('خطا: ' + e.message); }
        }

        function openEditProfile() {
            document.getElementById('displayNameInput').value = myProfile.display_name || '';
            document.getElementById('usernameInput').value = myProfile.username || '';
            document.getElementById('bioInput').value = myProfile.bio || '';
            document.getElementById('closeProfileBtn').style.display = 'block';
            openModal('profileModal');
        }

        async function saveProfile() {
            const display_name = document.getElementById('displayNameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const bio = document.getElementById('bioInput').value.trim();

            if (!display_name || !username) { alert('نام نمایشی و نام کاربری الزامی است!'); return; }

            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: myPhone, display_name, username, bio })
                });
                const data = await res.json();
                if (!data.ok) { alert(data.error || 'خطا در ذخیره پروفایل'); return; }

                myProfile = data.user;
                closeModal('profileModal');
                updateProfileUI();
                enterApp();
            } catch (e) { alert('خطا: ' + e.message); }
        }

        function updateProfileUI() {
            document.getElementById('myDisplayNameDisplay').innerText = myProfile.display_name || 'بدون نام';
            document.getElementById('myUsernameDisplay').innerText = '@' + (myProfile.username || 'username');
            document.getElementById('myBioDisplay').innerText = myProfile.bio || 'بیوگرافی ثبت نشده است.';
            document.getElementById('myAvatarLarge').innerText = myProfile.display_name ? myProfile.display_name[0] : '🐰';
        }

        function enterApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            updateProfileUI();
            loadUsersList();
            connectWS();
            loadHistory('public');
        }

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${myPhone}`);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.chat_id && data.chat_id !== currentChat) return;
                if (!data.chat_id && currentChat !== 'public') return;
                addMessage(data);
            };
        }

        async function loadUsersList() {
            try {
                const res = await fetch('/api/users?me=' + myPhone);
                const data = await res.json();
                const list = document.getElementById('usersList');
                list.innerHTML = '';

                // گزینه چت عمومی در بالای لیست پی‌وی‌ها
                const pub = document.createElement('div');
                pub.className = 'user-row';
                pub.innerHTML = `<div class="avatar-circle">🌐</div><div class="info"><b>چت عمومی</b><span>ارسال پیام همگانی</span></div>`;
                pub.onclick = () => switchChat('public', 'چت عمومی 🌐');
                list.appendChild(pub);

                (data.users || []).forEach(u => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<div class="avatar-circle">${(u.display_name || '?')[0]}</div>
                                     <div class="info"><b>${u.display_name}</b><span>@${u.username || 'بدون نام'}</span></div>`;
                    row.onclick = () => switchChat(u.phone, u.display_name);
                    list.appendChild(row);
                });
            } catch (e) { console.log(e); }
        }

        function switchChat(chatId, name) {
            currentChat = chatId;
            currentChatName = name;
            document.getElementById('chatTitle').innerText = name;
            document.getElementById('messagesList').innerHTML = '';
            loadHistory(chatId);
        }

        async function loadHistory(chatId) {
            try {
                const res = await fetch(`/api/history?chat_id=${chatId}&me=${myPhone}`);
                const data = await res.json();
                (data.messages || []).forEach(m => addMessage(m));
            } catch (e) { console.log(e); }
        }

        function addMessage(data) {
            const list = document.getElementById('messagesList');
            const div = document.createElement('div');
            if (data.type === 'system') {
                div.className = 'message system';
                div.innerText = data.content;
            } else {
                const isMine = (data.sender_phone === myPhone);
                div.className = 'message ' + (isMine ? 'user' : 'other');
                div.innerHTML = `<span class="sender">${data.user}</span>${data.content} <small style="opacity:.6; font-size:10px;">${data.timestamp || ''}</small>`;
            }
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) { alert('ارتباط قطع است!'); return; }
            ws.send(JSON.stringify({ content: text, chat_id: currentChat }));
            input.value = '';
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
