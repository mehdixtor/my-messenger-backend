<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Rabbit 🐰 Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #e0e0e0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 1200px; height: 100vh; background: #1e1e1e; display: flex; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #252525; padding: 30px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #333; }
        .auth-box h2 { color: #ff69b4; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e1e1e; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; }
        .auth-box button { width: 100%; padding: 12px; background: #ff69b4; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .auth-box button:hover { background: #ff1493; }

        /* Sidebar & Chat Layout */
        .sidebar { width: 320px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; position: relative; }
        
        .profile-header { padding: 15px; background: #222; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #333; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #ff69b4; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; overflow: hidden; font-size: 18px; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a2a2a; cursor: pointer; transition: background 0.2s; }
        .user-item:hover, .user-item.active { background: #2a2a2a; }
        .user-info { flex: 1; }
        .user-name { font-weight: bold; font-size: 14px; color: #fff; }
        .user-status { font-size: 12px; color: #888; margin-top: 3px; }

        .chat-header { padding: 15px; background: #222; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #1a1a1a; }
        
        .message { max-width: 65%; padding: 10px 14px; border-radius: 10px; position: relative; font-size: 14px; word-break: break-word; line-height: 1.4; }
        .message.sent { background: #005c4b; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #202c33; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); float: left; margin-top: 5px; margin-right: 8px; }
        .msg-ticks { font-size: 11px; float: left; margin-left: 3px; color: #53bdeb; }
        
        .chat-input-box { padding: 15px; background: #222; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        .chat-input-box input { flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; }
        .chat-input-box button { padding: 10px 20px; background: #ff69b4; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Modals & Profile Editor */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 500; display: none; }
        .modal-content { background: #252525; padding: 25px; border-radius: 12px; width: 400px; border: 1px solid #444; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin-bottom: 12px; background: #1e1e1e; border: 1px solid #555; color: #fff; border-radius: 6px; }
        
        @media(max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 100%; }
            .chat-area { display: none; width: 100%; height: 100%; }
            .mobile-back { display: inline-block !important; }
        }
        .mobile-back { display: none; background: none; border: none; color: #ff69b4; font-size: 18px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>Pink Rabbit 🐰</h2>
            <div id="step-phone">
                <input type="text" id="phone-input" placeholder="شماره موبایل (مثلا 0912...)">
                <button onclick="requestLogin()">ورود / ثبت‌نام</button>
            </div>
            <div id="step-code" style="display: none;">
                <p id="code-msg" style="margin-bottom: 15px; font-size: 13px; color: #aaa;"></p>
                <input type="text" id="code-input" placeholder="کد تأیید ۶ رقمی">
                <button onclick="verifyCode()">تأیید و ورود</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="main-app" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-panel">
            <div class="profile-header">
                <div class="avatar" id="my-avatar" onclick="openProfileModal()" style="cursor: pointer;">🐰</div>
                <div class="user-info">
                    <div class="user-name" id="my-display-name">کاربر</div>
                    <div class="user-status" id="my-phone-view">متصل</div>
                </div>
                <button onclick="openProfileModal()" style="background:none; border:none; color:#ff69b4; cursor:pointer; font-size:18px;">⚙️</button>
            </div>
            <div class="user-item" onclick="switchChat('public', 'چت عمومی اصلی')">
                <div class="avatar" style="background: #333;">🌐</div>
                <div class="user-info">
                    <div class="user-name">چت عمومی پینک ربیت</div>
                    <div class="user-status">همه کاربران</div>
                </div>
            </div>
            <div class="user-list" id="users-list-container">
                <!-- Dynamic users list -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-panel">
            <div class="chat-header">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-back" onclick="backToSidebar()">←</button>
                    <div class="avatar" id="current-chat-avatar" style="width: 35px; height: 35px; margin-left: 10px;">🌐</div>
                    <div>
                        <div class="user-name" id="current-chat-title">چت عمومی</div>
                        <div class="user-status" id="current-chat-status">آنلاین</div>
                    </div>
                </div>
                <div id="admin-actions-box"></div>
            </div>
            <div class="messages-box" id="messages-box"></div>
            <div class="chat-input-box">
                <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profile-modal">
        <div class="modal-content">
            <h3 style="color:#ff69b4; margin-bottom:15px;">تنظیمات پروفایل</h3>
            <label>نام نمایشی:</label>
            <input type="text" id="edit-display-name">
            <label>نام کاربری (username):</label>
            <input type="text" id="edit-username">
            <label>بیوگرافی:</label>
            <textarea id="edit-bio" rows="2"></textarea>
            <label>لینک آواتار عکس پروفایل:</label>
            <input type="text" id="edit-avatar" placeholder="آدرس مستقیم عکس یا گالری">
            <label>حریم خصوصی آخرین بازدید:</label>
            <select id="edit-privacy">
                <option value="everyone">همه (Everyone)</option>
                <option value="nobody">هیچ‌کس (Nobody)</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="saveProfile()" style="flex:1; background:#ff69b4; border:none; padding:10px; color:#fff; border-radius:6px; cursor:pointer;">ذخیره</button>
                <button onclick="closeProfileModal()" style="flex:1; background:#444; border:none; padding:10px; color:#fff; border-radius:6px; cursor:pointer;">انصراف</button>
            </div>
        </div>
    </div>

    <!-- Ban Modal (For Admin) -->
    <div class="modal" id="ban-modal">
        <div class="modal-content">
            <h3 style="color:#ff4444; margin-bottom:15px;">مدیریت مسدودسازی کاربر</h3>
            <p id="ban-target-name" style="margin-bottom: 10px;"></p>
            <label>مدت مسدودسازی:</label>
            <select id="ban-duration">
                <option value="5">۵ دقیقه</option>
                <option value="60">۱ ساعت</option>
                <option value="1440">۲۴ ساعت</option>
                <option value="0">تا ابد (دائمی)</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="submitBan()" style="flex:1; background:#ff4444; border:none; padding:10px; color:#fff; border-radius:6px; cursor:pointer;">مسدود کردن</button>
                <button onclick="submitUnban()" style="flex:1; background:#00aa00; border:none; padding:10px; color:#fff; border-radius:6px; cursor:pointer;">رفع مسدودیت</button>
                <button onclick="closeBanModal()" style="background:#444; border:none; padding:10px; color:#fff; border-radius:6px; cursor:pointer;">بستن</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isOwner = false;
        let ws = null;
        let currentTargetPhone = 'public'; // 'public' or phone number
        let usersDataMap = {};

        function requestLogin() {
            const phone = document.getElementById('phone-input').value.trim();
            if(!phone) return alert('لطفا شماره موبایل را وارد کنید');
            
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone})
            })
            .then(res => res.json())
            .then(data => {
                currentUser = phone;
                document.getElementById('step-phone').style.display = 'none';
                document.getElementById('step-code').style.display = 'block';
                if(data.status === 'new') {
                    document.getElementById('code-msg').innerText = `کد تأیید شما (حساب جدید): ${data.code}`;
                } else {
                    document.getElementById('code-msg').innerText = `حساب موجود است. لطفاً کد تأیید خود را وارد کنید (کد در دیتابیس ثبت شده است).`;
                }
            });
        }

        function verifyCode() {
            const code = document.getElementById('code-input').value.trim();
            if(!code) return alert('کد را وارد کنید');
            
            fetch('/api/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentUser, code})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    if(data.is_banned) {
                        alert('این اکانت فعلاً مسدود است تا: ' + data.banned_until);
                        return;
                    }
                    isOwner = data.is_owner;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    updateMyProfileUI(data.user);
                    connectWebSocket();
                    loadUsersList();
                    setInterval(loadUsersList, 10000);
                } else {
                    alert('کد اشتباه است');
                }
            });
        }

        function updateMyProfileUI(user) {
            document.getElementById('my-display-name').innerText = user.display_name || currentUser;
            document.getElementById('my-phone-view').innerText = currentUser;
            if(user.avatar) {
                document.getElementById('my-avatar').innerHTML = `<img src="${user.avatar}">`;
            }
        }

        function connectWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/${currentUser}`);
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if(data.type === 'banned') {
                    alert('شما مسدود شده‌اید!');
                    location.reload();
                } else if(data.type === 'chat') {
                    appendMessage(data.message);
                } else if(data.type === 'edit') {
                    const el = document.getElementById(`msg-${data.id}`);
                    if(el) {
                        el.querySelector('.msg-text').innerText = data.content + ' (ویرایش‌شده)';
                    }
                } else if(data.type === 'delete') {
                    const el = document.getElementById(`msg-${data.id}`);
                    if(el) {
                        el.querySelector('.msg-text').innerText = 'این پیام حذف شده است';
                    }
                }
            };
        }

        function loadUsersList() {
            fetch(`/api/users/${currentUser}`)
            .then(res => res.json())
            .then(users => {
                const container = document.getElementById('users-list-container');
                container.innerHTML = '';
                usersDataMap = {};
                
                users.forEach(u => {
                    if(u.phone === currentUser) return; // skip self
                    usersDataMap[u.phone] = u;
                    
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.onclick = () => switchChat(u.phone, u.display_name, u.avatar);
                    
                    let avatarHTML = u.display_name ? u.display_name[0] : '👤';
                    if(u.avatar) avatarHTML = `<img src="${u.avatar}">`;
                    
                    let adminBtn = '';
                    if(isOwner && !u.is_owner) {
                        adminBtn = `<button onclick="event.stopPropagation(); openBanModal('${u.phone}', '${u.display_name}')" style="background:#ff4444; border:none; color:#fff; padding:3px 8px; border-radius:4px; font-size:10px; margin-right:auto;">مدیریت</button>`;
                    }

                    div.innerHTML = `
                        <div class="avatar">${avatarHTML}</div>
                        <div class="user-info">
                            <div class="user-name">${u.display_name} ${u.is_owner ? '👑' : ''}</div>
                            <div class="user-status">${u.last_seen_text}</div>
                        </div>
                        ${adminBtn}
                    `;
                    container.appendChild(div);
                });
            });
        }

        function switchChat(target, title, avatar) {
            currentTargetPhone = target;
            document.getElementById('current-chat-title').innerText = title;
            document.getElementById('current-chat-status').innerText = target === 'public' ? 'عمومی' : (usersDataMap[target]?.last_seen_text || '');
            
            const avEl = document.getElementById('current-chat-avatar');
            if(target === 'public') {
                avEl.innerHTML = '🌐';
                document.getElementById('admin-actions-box').innerHTML = '';
            } else {
                avEl.innerHTML = avatar ? `<img src="${avatar}">` : title[0];
                if(isOwner && !usersDataMap[target]?.is_owner) {
                    document.getElementById('admin-actions-box').innerHTML = `<button onclick="openBanModal('${target}', '${title}')" style="background:#ff4444; border:none; color:#fff; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px;">بن / مسدودیت</button>`;
                } else {
                    document.getElementById('admin-actions-box').innerHTML = '';
                }
            }

            // Mobile responsive switch
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar-panel').style.display = 'none';
                document.getElementById('chat-panel').style.display = 'flex';
            }

            loadHistory(target);
        }

        function backToSidebar() {
            document.getElementById('sidebar-panel').style.display = 'flex';
            document.getElementById('chat-panel').style.display = 'none';
        }

        function loadHistory(target) {
            const box = document.getElementById('messages-box');
            box.innerHTML = '';
            
            let url = target === 'public' ? `/api/messages/public/public` : `/api/messages/${currentUser}/${target}`;
            // Correct public endpoint fetch if needed or handle in backend
            fetch(`/api/messages/${currentUser}/${target === 'public' ? 'public' : target}`)
            .then(res => res.json())
            .then(msgs => {
                if(Array.isArray(msgs)) {
                    msgs.forEach(m => appendMessage(m));
                }
            });
        }

        function appendMessage(m) {
            const box = document.getElementById('messages-box');
            const div = document.createElement('div');
            div.className = `message ${m.sender_phone === currentUser ? 'sent' : 'received'}`;
            div.id = `msg-${m.id}`;
            
            const timeStr = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let ticks = m.sender_phone === currentUser ? `<span class="msg-ticks">${m.seen ? '✓✓' : '✓'}</span>` : '';
            
            let editOpt = '';
            if(m.sender_phone === currentUser && !m.deleted_for_everyone) {
                editOpt = ` <span onclick="editMessage(${m.id})" style="font-size:10px; cursor:pointer; color:#aaa;">[ویرایش]</span> <span onclick="deleteMessage(${m.id})" style="font-size:10px; cursor:pointer; color:#ff8888;">[حذف]</span>`;
            }

            div.innerHTML = `
                <div class="msg-text">${m.content} ${m.is_edited ? '<small>(ویرایش‌شده)</small>' : ''}</div>
                <div>${editOpt}</div>
                <div class="msg-time">${timeStr} ${ticks}</div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if(!content) return;
            
            ws.send(JSON.stringify({
                type: 'chat',
                content: content,
                receiver_phone: currentTargetPhone === 'public' ? null : currentTargetPhone,
                sender_name: document.getElementById('my-display-name').innerText
            }));
            input.value = '';
        }

        function editMessage(id) {
            const newText = prompt('متن جدید پیام را وارد کنید:');
            if(newText) {
                ws.send(JSON.stringify({type: 'edit', id: id, content: newText}));
            }
        }

        function deleteMessage(id) {
            if(confirm('آیا پیام برای همه حذف شود؟')) {
                ws.send(JSON.stringify({type: 'delete', id: id, mode: 'everyone'}));
            }
        }

        // Profile Modal handlers
        function openProfileModal() {
            document.getElementById('profile-modal').style.display = 'flex';
            document.getElementById('edit-display-name').value = document.getElementById('my-display-name').innerText;
            document.getElementById('edit-bio').value = '';
        }
        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }
        function saveProfile() {
            const display_name = document.getElementById('edit-display-name').value;
            const username = document.getElementById('edit-username').value;
            const bio = document.getElementById('edit-bio').value;
            const avatar = document.getElementById('edit-avatar').value;
            const privacy = document.getElementById('edit-privacy').value;
            
            fetch('/api/profile/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentUser, display_name, username, bio, avatar, privacy})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('پروفایل به‌روز شد');
                    closeProfileModal();
                    if(display_name) document.getElementById('my-display-name').innerText = display_name;
                    if(avatar) document.getElementById('my-avatar').innerHTML = `<img src="${avatar}">`;
                }
            });
        }

        // Ban Modal handlers
        let activeBanPhone = null;
        function openBanModal(phone, name) {
            activeBanPhone = phone;
            document.getElementById('ban-target-name').innerText = `کاربر: ${name} (${phone})`;
            document.getElementById('ban-modal').style.display = 'flex';
        }
        function closeBanModal() {
            document.getElementById('ban-modal').style.display = 'none';
        }
        function submitBan() {
            const minutes = parseInt(document.getElementById('ban-duration').value);
            fetch('/api/admin/ban', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({admin_phone: currentUser, target_phone: activeBanPhone, minutes})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('کاربر با موفقیت مسدود شد.');
                    closeBanModal();
                    loadUsersList();
                }
            });
        }
        function submitUnban() {
            fetch('/api/admin/unban', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({admin_phone: currentUser, target_phone: activeBanPhone, minutes: 0})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('رفع مسدودیت انجام شد.');
                    closeBanModal();
                    loadUsersList();
                }
            });
        }
    </script>
</body>
</html>
