<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Rabbit 🐰</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">
    <style>
        :root {
            --pink-main: #ff69b4;
            --pink-light: #ffb6c1;
            --pink-dark: #ff1493;
            --bg-color: #fff0f5;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* ---------- صفحه ورود ---------- */
        .login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; position: relative; z-index: 1;
        }
        .login-screen h2 { color: var(--pink-main); text-align: center; margin-bottom: 20px; font-size: 20px; }
        .login-screen input {
            padding: 12px; width: 260px; border: 2px solid var(--pink-light);
            border-radius: 8px; outline: none; font-size: 16px; text-align: center;
            font-family: inherit;
        }
        .login-screen button {
            padding: 12px 24px; background: var(--pink-main); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
            margin-top: 15px; transition: 0.3s; font-family: inherit; font-size: 15px;
        }
        .login-screen button:hover { background: var(--pink-dark); }

        /* خرگوش‌های دکوراتیو */
        .rabbit-deco { position: absolute; font-size: 60px; user-select: none; animation: blink 2s infinite; z-index: 0; }
        .rabbit-deco.left { left: 20px; bottom: 150px; }
        .rabbit-deco.right { right: 20px; bottom: 150px; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }

        /* ---------- مودال عمومی ---------- */
        .modal {
            display: none; position: fixed; z-index: 10; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.45);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 22px; border-radius: 16px; width: 90%;
            max-width: 320px; display: flex; flex-direction: column; gap: 10px;
            border: 2px solid var(--pink-light);
        }
        .modal-content h3 { margin: 0 0 5px; color: var(--pink-main); text-align: center; }
        .modal-content p { margin: 0; font-size: 13px; color: #777; text-align: center; line-height: 1.7; }
        .modal-content input, .modal-content textarea {
            padding: 10px; border: 1px solid var(--pink-light); border-radius: 8px;
            outline: none; font-family: inherit; font-size: 14px; resize: none;
        }
        .modal-content button {
            padding: 10px; background: var(--pink-main); color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit;
        }
        .modal-content button:hover { background: var(--pink-dark); }
        .code-box {
            background: #fff5f8; border: 2px dashed var(--pink-main); border-radius: 10px;
            padding: 14px; text-align: center; font-size: 26px; font-weight: bold;
            letter-spacing: 4px; color: var(--pink-dark); direction: ltr;
        }

        /* ---------- صفحه چت ---------- */
        .chat-container {
            width: 100%; max-width: 500px; height: 90vh;
            background: white; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255,105,180,0.2);
            display: none; flex-direction: column; overflow: hidden;
            border: 2px solid var(--pink-light);
        }
        .chat-header {
            background: var(--pink-main); color: white; padding: 12px 15px;
            display: flex; align-items: center; justify-content: space-between;
            font-weight: bold; font-size: 15px;
        }
        .chat-header .left-group { display: flex; align-items: center; gap: 8px; }
        .avatar-circle {
            width: 34px; height: 34px; border-radius: 50%; background: white;
            color: var(--pink-dark); display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .header-btn {
            background: rgba(255,255,255,0.25); border: none; color: white;
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
            font-size: 12px;
        }
        .header-btn:hover { background: rgba(255,255,255,0.4); }

        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            background: #fff5f8;
        }
        .message { padding: 9px 13px; border-radius: 12px; max-width: 78%; word-break: break-word; font-size: 14px; line-height: 1.6; }
        .message .sender { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; opacity: 0.85; }
        .message.system { background: #ffe4e1; color: #d87093; align-self: center; font-size: 12px; border-radius: 20px; }
        .message.user { background: var(--pink-light); color: #fff; align-self: flex-end; }
        .message.other { background: white; color: #333; align-self: flex-start; border: 1px solid #ffc0cb; }

        .chat-input { display: flex; padding: 10px; background: white; border-top: 1px solid #ffc0cb; }
        .chat-input input {
            flex: 1; padding: 10px; border: 1px solid var(--pink-light);
            border-radius: 8px; outline: none; font-size: 14px; font-family: inherit;
        }
        .chat-input button {
            background: var(--pink-main); color: white; border: none;
            padding: 10px 18px; margin-right: 8px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-family: inherit;
        }
        .chat-input button:hover { background: var(--pink-dark); }

        /* لیست کاربران */
        .users-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
        .user-row {
            display: flex; align-items: center; gap: 10px; padding: 8px;
            border-radius: 10px; cursor: pointer; border: 1px solid #ffe4e1;
        }
        .user-row:hover { background: #fff5f8; }
        .user-row .info { flex: 1; text-align: right; }
        .user-row .info b { font-size: 13px; display: block; }
        .user-row .info span { font-size: 11px; color: #999; }
    </style>
</head>
<body>

    <!-- ============ صفحه ورود ============ -->
    <div id="loginScreen" class="login-screen">
        <div class="rabbit-deco left">🐰</div>
        <div class="rabbit-deco right">🐰</div>
        <h2>به پیام‌رسان 🐰 Pink Rabbit 🐰 خوش اومدی</h2>
        <input type="tel" id="phoneInput" placeholder="شماره موبایل (مثلاً 09123456789)" maxlength="11">
        <button onclick="requestLogin()">ورود / ثبت‌نام</button>
    </div>

    <!-- ============ مودال کد دائمی ============ -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <h3 id="codeTitle">کد ورود شما</h3>
            <p id="codeDesc">این کد مخصوص شماره شماست و همیشه با همین کد وارد می‌شوید.</p>
            <div class="code-box" id="codeBox">------</div>
            <input type="text" id="codeInput" placeholder="کد را وارد کنید" style="text-align:center; direction:ltr; letter-spacing:3px;">
            <button onclick="submitCode()">تأیید و ورود</button>
        </div>
    </div>

    <!-- ============ مودال تکمیل پروفایل ============ -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3>پروفایل خودت رو بساز 🐰</h3>
            <input type="text" id="displayNameInput" placeholder="نام نمایشی (مثلاً مهدی)">
            <input type="text" id="usernameInput" placeholder="نام کاربری (مثلاً mehdixtor)">
            <textarea id="bioInput" rows="3" placeholder="بیوگرافی کوتاه..."></textarea>
            <button onclick="saveProfile()">ذخیره و ورود به چت</button>
        </div>
    </div>

    <!-- ============ مودال لیست کاربران (پی‌وی) ============ -->
    <div id="usersModal" class="modal">
        <div class="modal-content">
            <h3>شروع پیام خصوصی</h3>
            <div class="users-list" id="usersList"></div>
            <button onclick="closeModal('usersModal')">بستن</button>
        </div>
    </div>

    <!-- ============ صفحه چت ============ -->
    <div id="chatScreen" class="chat-container">
        <div class="chat-header">
            <div class="left-group">
                <div class="avatar-circle" id="myAvatar">🐰</div>
                <span id="chatTitle">چت عمومی</span>
            </div>
            <button class="header-btn" onclick="openUsersList()">پی‌وی</button>
        </div>
        <div class="chat-messages" id="messagesList"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script>
        let ws = null;
        let myPhone = "";
        let myProfile = { display_name: "", username: "", bio: "" };
        let currentChat = "public"; // public یا شماره طرف مقابل
        let currentChatName = "چت عمومی";

        /* ---------- کمکی ---------- */
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        /* ---------- ۱. درخواست ورود ---------- */
        async function requestLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!/^09\d{9}$/.test(phone)) {
                alert('شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود!');
                return;
            }
            myPhone = phone;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
                const data = await res.json();

                if (data.error) { alert(data.error); return; }

                document.getElementById('codeBox').innerText = data.code;

                if (data.is_new) {
                    document.getElementById('codeTitle').innerText = 'کد دائمی شما ساخته شد!';
                    document.getElementById('codeDesc').innerText = 'این کد را یادداشت کن؛ همیشه با همین کد وارد می‌شوی.';
                } else {
                    document.getElementById('codeTitle').innerText = 'کد ورود شما';
                    document.getElementById('codeDesc').innerText = 'کد مخصوص شماره شماست. آن را وارد کن.';
                }
                openModal('codeModal');
            } catch (e) {
                alert('خطا در ارتباط با سرور: ' + e.message);
            }
        }

        /* ---------- ۲. تأیید کد ---------- */
        async function submitCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) { alert('کد را وارد کنید!'); return; }

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: myPhone, code: code })
                });
                const data = await res.json();

                if (!data.ok) { alert(data.error || 'کد اشتباه است!'); return; }

                closeModal('codeModal');
                myProfile = data.user || {};

                // اگر پروفایل ناقص بود، بپرس
                if (!myProfile.display_name || !myProfile.username) {
                    openModal('profileModal');
                } else {
                    enterChat();
                }
            } catch (e) {
                alert('خطا: ' + e.message);
            }
        }

        /* ---------- ۳. ذخیره پروفایل ---------- */
        async function saveProfile() {
            const display_name = document.getElementById('displayNameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const bio = document.getElementById('bioInput').value.trim();

            if (!display_name || !username) { alert('نام نمایشی و نام کاربری الزامی است!'); return; }

            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: myPhone, display_name, username, bio })
                });
                const data = await res.json();
                if (!data.ok) { alert(data.error || 'خطا در ذخیره پروفایل'); return; }

                myProfile = data.user;
                closeModal('profileModal');
                enterChat();
            } catch (e) {
                alert('خطا: ' + e.message);
            }
        }

        /* ---------- ۴. ورود به چت ---------- */
        function enterChat() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('myAvatar').innerText = myProfile.display_name ? myProfile.display_name[0] : '🐰';

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${myPhone}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log("Connected");
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);

                // فیلتر پی‌وی: فقط پیام‌هایی که مربوط به این چت است
                if (data.type === 'chat' && data.chat_id && data.chat_id !== currentChat) return;
                if (data.type === 'chat' && !data.chat_id && currentChat !== 'public') return;
                if (data.type === 'system' && currentChat !== 'public') return;

                addMessage(data);
            };

            ws.onclose = function() {
                addMessage({ type: 'system', content: '❌ ارتباط با سرور قطع شد. صفحه را رفرش کن.', timestamp: '' });
            };
        }

        /* ---------- ۵. نمایش پیام ---------- */
        function addMessage(data) {
            const list = document.getElementById('messagesList');
            const div = document.createElement('div');

            if (data.type === 'system') {
                div.className = 'message system';
                div.innerText = data.content + (data.timestamp ? ` (${data.timestamp})` : '');
            } else {
                const isMine = (data.sender_phone === myPhone);
                div.className = 'message ' + (isMine ? 'user' : 'other');
                div.innerHTML = `<span class="sender">${data.user}</span>${data.content} <small style="opacity:.6">${data.timestamp || ''}</small>`;
            }
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        /* ---------- ۶. ارسال پیام ---------- */
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) { alert('ارتباط برقرار نیست!'); return; }

            ws.send(JSON.stringify({ content: text, chat_id: currentChat }));
            input.value = '';
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

        /* ---------- ۷. لیست کاربران برای پی‌وی ---------- */
        async function openUsersList() {
            try {
                const res = await fetch('/api/users?me=' + myPhone);
                const data = await res.json();
                const list = document.getElementById('usersList');
                list.innerHTML = '';

                // دکمه چت عمومی
                const pub = document.createElement('div');
                pub.className = 'user-row';
                pub.innerHTML = `<div class="avatar-circle" style="background:#ffe4e1">🌐</div>
                                 <div class="info"><b>چت عمومی</b><span>همه کاربران</span></div>`;
                pub.onclick = () => switchChat('public', 'چت عمومی');
                list.appendChild(pub);

                (data.users || []).forEach(u => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<div class="avatar-circle" style="background:#ffe4e1">${(u.display_name || '?')[0]}</div>
                                     <div class="info"><b>${u.display_name}</b><span>@${u.username || 'بدون نام کاربری'}</span></div>`;
                    row.onclick = () => switchChat(u.phone, u.display_name);
                    list.appendChild(row);
                });

                openModal('usersModal');
            } catch (e) {
                alert('خطا در دریافت کاربران: ' + e.message);
            }
        }

        function switchChat(chatId, name) {
            currentChat = chatId;
            currentChatName = name;
            document.getElementById('chatTitle').innerText = name;
            document.getElementById('messagesList').innerHTML = '';
            closeModal('usersModal');
            loadHistory(chatId);
        }

        async function loadHistory(chatId) {
            try {
                const res = await fetch(`/api/history?chat_id=${chatId}&me=${myPhone}`);
                const data = await res.json();
                (data.messages || []).forEach(m => addMessage(m));
            } catch (e) { console.log(e); }
        }
    </script>
</body>
</html>
